<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: http: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src *;">
  <title>Joe Browser</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    /* ── Navbar ── */
    #navbar {
      display: flex; align-items: center; gap: 4px;
      height: 42px; min-height: 42px; padding: 0 6px;
      background: var(--nav-bg, #1f1f2e); color: var(--nav-fg, #e0e0e0);
      border-bottom: 1px solid var(--nav-border, #333);
      user-select: none; -webkit-app-region: drag; z-index: 100;
    }
    #navbar button, #navbar input, #navbar .url-bar {
      -webkit-app-region: no-drag;
    }

    /* Navigation buttons */
    .nav-btn {
      display: flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; border: none; border-radius: 6px;
      background: transparent; color: var(--nav-fg, #e0e0e0);
      cursor: pointer; font-size: 16px; transition: background 0.15s;
    }
    .nav-btn:hover { background: rgba(255,255,255,0.1); }
    .nav-btn:active { background: rgba(255,255,255,0.15); }
    .nav-btn:disabled { opacity: 0.35; cursor: default; }
    .nav-btn:disabled:hover { background: transparent; }

    /* URL bar */
    .url-bar {
      flex: 1; display: flex; align-items: center;
      height: 30px; padding: 0 10px; margin: 0 4px;
      background: var(--url-bg, #2a2a3d); border: 1px solid var(--url-border, #444);
      border-radius: 16px; overflow: hidden; transition: border-color 0.2s;
    }
    .url-bar:focus-within { border-color: var(--accent, #5B5FC7); }
    .url-bar .lock-icon { font-size: 13px; margin-right: 6px; opacity: 0.7; flex-shrink: 0; }
    .url-bar input {
      flex: 1; border: none; outline: none; background: transparent;
      color: var(--nav-fg, #e0e0e0); font-size: 13px; font-family: inherit;
      min-width: 0;
    }
    .url-bar input::placeholder { color: rgba(255,255,255,0.35); }

    /* Profile badge */
    .profile-badge {
      display: flex; align-items: center; gap: 5px;
      padding: 0 8px; height: 28px; border-radius: 14px;
      background: var(--accent, #5B5FC7); color: #fff;
      font-size: 11px; font-weight: 600; white-space: nowrap;
      max-width: 160px; overflow: hidden; text-overflow: ellipsis;
    }

    /* Browser type badge */
    .browser-badge {
      display: flex; align-items: center; gap: 4px;
      padding: 0 8px; height: 28px; border-radius: 14px;
      background: var(--browser-bg, #333); color: var(--browser-fg, #fff);
      font-size: 11px; font-weight: 500; white-space: nowrap;
    }
    .browser-badge svg { width: 14px; height: 14px; }

    /* Loading bar */
    .loading-bar {
      position: absolute; top: 42px; left: 0; height: 2px;
      background: var(--accent, #5B5FC7); z-index: 99;
      transition: width 0.3s ease; width: 0;
    }
    .loading-bar.active { width: 70%; transition: width 0.5s ease; }
    .loading-bar.complete { width: 100%; transition: width 0.2s ease; }

    /* ── Webview container ── */
    #webview-container {
      position: absolute; top: 42px; left: 0; right: 0; bottom: 0;
      background: #fff;
    }
    #webview-container webview {
      width: 100%; height: 100%; display: block;
    }

    /* ── Mobile frame ── */
    .mobile-frame {
      display: flex; align-items: center; justify-content: center;
      background: #1a1a2e;
    }
    .mobile-frame #webview-container {
      position: relative; top: auto; left: auto; right: auto; bottom: auto;
      width: var(--mobile-width, 375px); height: var(--mobile-height, 812px);
      border-radius: 12px; overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    /* ── Footer ── */
    .footer-bar {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 24px; display: flex; align-items: center; justify-content: center;
      background: var(--nav-bg, #1f1f2e); color: rgba(255,255,255,0.4);
      font-size: 10px; z-index: 100;
    }
  </style>
</head>
<body>
  <!-- Navigation Bar -->
  <div id="navbar">
    <button class="nav-btn" id="btn-back" title="Back" disabled>&#9664;</button>
    <button class="nav-btn" id="btn-forward" title="Forward" disabled>&#9654;</button>
    <button class="nav-btn" id="btn-refresh" title="Refresh">&#8635;</button>
    <button class="nav-btn" id="btn-home" title="Home">&#8962;</button>
    <div class="url-bar">
      <span class="lock-icon" id="lock-icon">&#128274;</span>
      <input type="text" id="url-input" placeholder="Search or enter URL" spellcheck="false" autocomplete="off" />
    </div>
    <div class="browser-badge" id="browser-badge">
      <span id="browser-icon"></span>
      <span id="browser-name">Chrome</span>
    </div>
    <div class="profile-badge" id="profile-badge">Profile</div>
  </div>

  <!-- Loading bar -->
  <div class="loading-bar" id="loading-bar"></div>

  <!-- Webview container -->
  <div id="webview-container"></div>

  <!-- Footer -->
  <div class="footer-bar">Built with &#10084;&#65039; by Joe Goldberg &middot; @joegoldberg2025</div>

  <script>
    const { ipcRenderer } = require('electron');

    // Get config from query params
    const params = new URLSearchParams(window.location.search);
    const profileId = params.get('pid') || '';
    const profileName = params.get('pname') || 'Profile';
    const browserType = params.get('btype') || 'chrome';
    const startUrl = params.get('url') || 'https://iphey.com';
    const partition = params.get('partition') || '';
    const isMobile = params.get('mobile') === 'true';
    const mobileWidth = parseInt(params.get('mw') || '375', 10);
    const mobileHeight = parseInt(params.get('mh') || '812', 10);

    // Apply browser type theme
    const themes = {
      chrome:  { navBg: '#1f1f2e', navFg: '#e0e0e0', accent: '#4285F4', browserBg: '#4285F4', browserFg: '#fff', name: 'Chrome' },
      edge:    { navBg: '#1a1f2e', navFg: '#e0e0e0', accent: '#0078D4', browserBg: '#0078D4', browserFg: '#fff', name: 'Edge' },
      brave:   { navBg: '#1e1a2e', navFg: '#e0e0e0', accent: '#FB542B', browserBg: '#FB542B', browserFg: '#fff', name: 'Brave' },
      firefox: { navBg: '#2a1a1a', navFg: '#e0e0e0', accent: '#FF7139', browserBg: '#FF7139', browserFg: '#fff', name: 'Firefox' },
      chromium:{ navBg: '#1f1f2e', navFg: '#e0e0e0', accent: '#4285F4', browserBg: '#4285F4', browserFg: '#fff', name: 'Chromium' }
    };
    const theme = themes[browserType] || themes.chrome;
    const root = document.documentElement.style;
    root.setProperty('--nav-bg', theme.navBg);
    root.setProperty('--nav-fg', theme.navFg);
    root.setProperty('--nav-border', theme.accent + '33');
    root.setProperty('--url-bg', theme.navBg);
    root.setProperty('--url-border', theme.accent + '44');
    root.setProperty('--accent', theme.accent);
    root.setProperty('--browser-bg', theme.browserBg);
    root.setProperty('--browser-fg', theme.browserFg);

    // Set UI text
    document.getElementById('browser-name').textContent = theme.name;
    document.getElementById('profile-badge').textContent = profileName;
    document.title = 'Joe Browser \u2014 ' + profileName;

    // Browser icon SVGs
    const browserIcons = {
      chrome: '<svg viewBox="0 0 48 48" width="14" height="14"><circle cx="24" cy="24" r="22" fill="#4285F4"/><circle cx="24" cy="24" r="9" fill="#fff"/><circle cx="24" cy="24" r="7" fill="#4285F4"/><circle cx="24" cy="12" r="4" fill="#DB4437"/><circle cx="13.5" cy="30" r="4" fill="#0F9D58"/><circle cx="34.5" cy="30" r="4" fill="#F4B400"/></svg>',
      edge: '<svg viewBox="0 0 48 48" width="14" height="14"><circle cx="24" cy="24" r="22" fill="#0078D4"/><path d="M14 30c0-8 5-14 14-14 3 0 6 1 8 3-2-4-7-7-12-7-8 0-14 6-14 14 0 5 2 9 6 11-1-2-2-4-2-7z" fill="#fff"/></svg>',
      brave: '<svg viewBox="0 0 48 48" width="14" height="14"><circle cx="24" cy="24" r="22" fill="#FB542B"/><path d="M24 10l-8 4-3 9 5 7 6 4 6-4 5-7-3-9z" fill="#fff" opacity="0.9"/></svg>',
      firefox: '<svg viewBox="0 0 48 48" width="14" height="14"><circle cx="24" cy="24" r="22" fill="#FF7139"/><path d="M24 8c-2 4-1 8 1 11 3 3 5 6 5 10 0 5-4 9-9 9s-9-4-9-9c0-3 1-5 3-7-1 2 0 5 2 7 2 1 4 0 5-2 1-3-1-5-2-7-2-4-1-8 2-11 1 3 4 5 7 5 3 0 5-2 5-5 0-2-1-4-3-5 2 0 4 1 5 3 1-2 0-4-1-6-3-1-6 0-8 2z" fill="#fff" opacity="0.9"/></svg>',
      chromium: '<svg viewBox="0 0 48 48" width="14" height="14"><circle cx="24" cy="24" r="22" fill="#4285F4"/><circle cx="24" cy="24" r="9" fill="#fff"/><circle cx="24" cy="24" r="7" fill="#4285F4"/></svg>'
    };
    document.getElementById('browser-icon').innerHTML = browserIcons[browserType] || browserIcons.chrome;

    // Create webview
    const container = document.getElementById('webview-container');
    const webview = document.createElement('webview');
    webview.partition = partition;
    webview.src = startUrl;
    webview.allowpopups = 'true';

    // Mobile layout
    if (isMobile) {
      document.body.classList.add('mobile-frame');
      container.classList.add('mobile-frame');
      root.setProperty('--mobile-width', mobileWidth + 'px');
      root.setProperty('--mobile-height', mobileHeight + 'px');
    }

    container.appendChild(webview);

    // Navigation elements
    const btnBack = document.getElementById('btn-back');
    const btnForward = document.getElementById('btn-forward');
    const btnRefresh = document.getElementById('btn-refresh');
    const btnHome = document.getElementById('btn-home');
    const urlInput = document.getElementById('url-input');
    const lockIcon = document.getElementById('lock-icon');
    const loadingBar = document.getElementById('loading-bar');

    // Update URL bar
    function updateUrl(url) {
      if (document.activeElement !== urlInput) {
        urlInput.value = url;
      }
      // Update lock icon
      if (url.startsWith('https://')) {
        lockIcon.innerHTML = '&#128274;';
      } else if (url.startsWith('http://')) {
        lockIcon.innerHTML = '&#128275;';
      } else {
        lockIcon.innerHTML = '&#128196;';
      }
    }

    // Navigation events
    webview.addEventListener('did-navigate', (e) => {
      updateUrl(e.url);
      btnBack.disabled = !webview.canGoBack();
      btnForward.disabled = !webview.canGoForward();
      loadingBar.className = 'loading-bar complete';
      setTimeout(() => { loadingBar.className = 'loading-bar'; }, 300);
    });

    webview.addEventListener('did-navigate-in-page', (e) => {
      updateUrl(e.url);
    });

    webview.addEventListener('did-start-loading', () => {
      loadingBar.className = 'loading-bar active';
    });

    webview.addEventListener('did-stop-loading', () => {
      loadingBar.className = 'loading-bar complete';
      setTimeout(() => { loadingBar.className = 'loading-bar'; }, 300);
    });

    webview.addEventListener('page-title-updated', (e) => {
      document.title = 'Joe Browser \u2014 ' + e.title;
    });

    // URL input
    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        let val = urlInput.value.trim();
        if (val && !val.match(/^https?:\/\//i) && !val.startsWith('about:')) {
          // Check if it looks like a URL
          if (val.includes('.') && !val.includes(' ')) {
            val = 'https://' + val;
          } else {
            val = 'https://www.google.com/search?q=' + encodeURIComponent(val);
          }
        }
        webview.loadURL(val);
        urlInput.blur();
      }
    });

    urlInput.addEventListener('focus', () => {
      urlInput.select();
    });

    // Button handlers
    btnBack.addEventListener('click', () => { if (webview.canGoBack()) webview.goBack(); });
    btnForward.addEventListener('click', () => { if (webview.canGoForward()) webview.goForward(); });
    btnRefresh.addEventListener('click', () => { webview.reload(); });
    btnHome.addEventListener('click', () => { webview.loadURL('https://iphey.com'); });

    // New window handler - open in same webview
    webview.addEventListener('new-window', (e) => {
      e.preventDefault();
      webview.loadURL(e.url);
    });

    // IPC: main process can send commands
    ipcRenderer.on('browser:navigate', (_event, url) => {
      webview.loadURL(url);
    });

    ipcRenderer.on('browser:go-back', () => { if (webview.canGoBack()) webview.goBack(); });
    ipcRenderer.on('browser:go-forward', () => { if (webview.canGoForward()) webview.goForward(); });
    ipcRenderer.on('browser:reload', () => { webview.reload(); });
  </script>
</body>
</html>
