<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joe Browser</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --theme-primary: #4285F4;
      --theme-accent: #34A853;
      --bg-dark: #1a1a2e;
      --bg-chrome: #202124;
      --bg-input: #35363a;
      --bg-tab: #2d2e32;
      --bg-tab-active: #35363a;
      --text-primary: #e8eaed;
      --text-secondary: #9aa0a6;
      --text-dim: #5f6368;
      --border-color: #3c4043;
      --hover-bg: #3c4043;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ========== TAB BAR ========== */
    .tab-bar {
      display: flex;
      align-items: flex-end;
      background: var(--bg-chrome);
      padding: 4px 8px 0;
      gap: 1px;
      min-height: 36px;
      -webkit-app-region: drag;
      user-select: none;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      background: var(--bg-tab);
      color: var(--text-secondary);
      border-radius: 8px 8px 0 0;
      font-size: 12px;
      cursor: pointer;
      max-width: 200px;
      min-width: 60px;
      transition: background 0.15s, color 0.15s;
      -webkit-app-region: no-drag;
    }

    .tab.active {
      background: var(--bg-tab-active);
      color: var(--text-primary);
    }

    .tab:hover:not(.active) { background: var(--hover-bg); }

    .tab-favicon {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    .tab-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .tab-close {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      opacity: 0;
      transition: opacity 0.15s, background 0.15s;
      flex-shrink: 0;
      cursor: pointer;
    }

    .tab:hover .tab-close, .tab.active .tab-close { opacity: 0.6; }
    .tab-close:hover { background: rgba(255,255,255,0.2); opacity: 1 !important; }

    .tab-new {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 16px;
      margin-left: 4px;
      transition: background 0.15s;
      -webkit-app-region: no-drag;
    }

    .tab-new:hover { background: var(--hover-bg); color: var(--text-primary); }

    /* ========== NAVIGATION BAR ========== */
    .nav-bar {
      display: flex;
      align-items: center;
      background: var(--bg-tab-active);
      padding: 4px 8px;
      gap: 3px;
      border-bottom: 1px solid var(--border-color);
      -webkit-app-region: drag;
      user-select: none;
    }

    .nav-btn {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: background 0.15s, color 0.15s;
      -webkit-app-region: no-drag;
      flex-shrink: 0;
    }

    .nav-btn:hover { background: var(--hover-bg); color: var(--text-primary); }
    .nav-btn:disabled { opacity: 0.25; cursor: not-allowed; }

    .browser-badge {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--theme-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }

    .url-bar-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--bg-dark);
      border-radius: 16px;
      padding: 0 12px;
      height: 28px;
      margin: 0 4px;
      -webkit-app-region: no-drag;
      border: 2px solid transparent;
      transition: border-color 0.2s;
    }

    .url-bar-wrap:focus-within { border-color: var(--theme-primary); }

    .url-bar-icon {
      font-size: 12px;
      margin-right: 6px;
      flex-shrink: 0;
    }

    .url-bar-icon.secure { color: #34A853; }
    .url-bar-icon.insecure { color: #FBBC04; }

    .url-bar {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-size: 12px;
      outline: none;
      font-family: inherit;
    }

    .url-bar::placeholder { color: var(--text-dim); }

    .profile-badge {
      padding: 2px 8px;
      border-radius: 10px;
      background: var(--theme-primary);
      color: white;
      font-size: 10px;
      font-weight: 600;
      max-width: 100px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }

    /* ========== LOADING BAR ========== */
    .loading-bar {
      height: 2px;
      background: transparent;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }

    .loading-bar.active::after {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 30%;
      background: var(--theme-primary);
      animation: loadingSlide 1.2s ease-in-out infinite;
    }

    @keyframes loadingSlide {
      0% { left: -30%; }
      100% { left: 100%; }
    }

    /* ========== WEBVIEW AREA ========== */
    .webview-area {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: var(--bg-dark);
    }

    .webview-area webview {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: inline-flex;
    }

    .webview-area.mobile-frame {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0a0a1a;
    }

    .webview-area.mobile-frame webview {
      position: relative;
      border-radius: 12px;
      border: 3px solid #333;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }

    /* ========== ERROR PAGE ========== */
    .error-page {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      background: var(--bg-dark);
      color: var(--text-secondary);
      gap: 12px;
      padding: 20px;
    }

    .error-page.active { display: flex; }
    .error-page .error-icon { font-size: 48px; color: var(--theme-primary); }
    .error-page h2 { color: var(--text-primary); font-size: 16px; }
    .error-page p { font-size: 13px; max-width: 400px; text-align: center; line-height: 1.5; }

    .error-page button {
      padding: 8px 20px;
      border: none;
      border-radius: 6px;
      background: var(--theme-primary);
      color: white;
      cursor: pointer;
      font-size: 13px;
      margin-top: 4px;
    }

    .error-page button:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
  <!-- Tab Bar -->
  <div class="tab-bar">
    <div class="tab active" id="tab0">
      <div class="tab-favicon" id="tabFavicon"></div>
      <span class="tab-title" id="tabTitle">New Tab</span>
      <div class="tab-close" title="Close">&#10005;</div>
    </div>
    <div class="tab-new" title="New Tab" id="btnNewTab">+</div>
  </div>

  <!-- Navigation Bar -->
  <div class="nav-bar">
    <div class="browser-badge" id="browserBadge">J</div>
    <button class="nav-btn" id="btnBack" title="Back" disabled>&#9664;</button>
    <button class="nav-btn" id="btnForward" title="Forward" disabled>&#9654;</button>
    <button class="nav-btn" id="btnRefresh" title="Reload">&#8635;</button>
    <button class="nav-btn" id="btnHome" title="Home">&#8962;</button>
    <div class="url-bar-wrap">
      <span class="url-bar-icon secure" id="urlIcon">&#128274;</span>
      <input type="text" class="url-bar" id="urlInput" placeholder="Search or enter URL" spellcheck="false" autocomplete="off">
    </div>
    <div class="profile-badge" id="profileBadge">Profile</div>
  </div>

  <!-- Loading Bar -->
  <div class="loading-bar" id="loadingBar"></div>

  <!-- Webview Area -->
  <div class="webview-area" id="webviewArea">
    <!-- Webview is created dynamically -->
  </div>

  <!-- Error Page -->
  <div class="error-page" id="errorPage">
    <div class="error-icon">&#9888;</div>
    <h2>This page can't be reached</h2>
    <p id="errorMessage">Check your internet connection and try again.</p>
    <button id="btnRetry">Try Again</button>
  </div>

  <script>
    (function() {
      'use strict';

      // ---- Parse URL parameters ----
      var params = new URLSearchParams(window.location.search);
      var targetUrl = params.get('url') || 'https://iphey.com';
      var profileId = params.get('profile') || '';
      var profileName = decodeURIComponent(params.get('profileName') || 'Profile');
      var browserType = params.get('browserType') || 'chrome';
      var deviceType = params.get('deviceType') || 'desktop';
      var themePrimary = params.get('themePrimary') || '#4285F4';
      var themeAccent = params.get('themeAccent') || '#34A853';
      var isMobile = params.get('isMobile') === 'true';
      var mobileWidth = parseInt(params.get('mobileWidth') || '390');
      var mobileHeight = parseInt(params.get('mobileHeight') || '844');
      var partitionName = 'persist:joe-' + profileId;

      // ---- Apply theme ----
      document.documentElement.style.setProperty('--theme-primary', themePrimary);
      document.documentElement.style.setProperty('--theme-accent', themeAccent);

      // ---- Set browser badge ----
      var badgeLetters = { chrome: 'C', brave: 'B', firefox: 'F', edge: 'E', chromium: 'C' };
      var browserBadge = document.getElementById('browserBadge');
      browserBadge.textContent = badgeLetters[browserType] || 'J';
      browserBadge.style.background = themePrimary;

      // ---- Set tab favicon ----
      var tabFavicon = document.getElementById('tabFavicon');
      tabFavicon.textContent = badgeLetters[browserType] || 'J';
      tabFavicon.style.background = themePrimary;

      // ---- Set profile badge ----
      var profileBadge = document.getElementById('profileBadge');
      profileBadge.textContent = profileName;
      profileBadge.style.background = themePrimary;

      // ---- DOM elements ----
      var urlInput = document.getElementById('urlInput');
      var urlIcon = document.getElementById('urlIcon');
      var tabTitle = document.getElementById('tabTitle');
      var loadingBar = document.getElementById('loadingBar');
      var webviewArea = document.getElementById('webviewArea');
      var errorPage = document.getElementById('errorPage');
      var errorMessage = document.getElementById('errorMessage');
      var btnBack = document.getElementById('btnBack');
      var btnForward = document.getElementById('btnForward');
      var btnRefresh = document.getElementById('btnRefresh');
      var btnHome = document.getElementById('btnHome');
      var btnRetry = document.getElementById('btnRetry');
      var btnNewTab = document.getElementById('btnNewTab');

      // ---- Set up mobile frame ----
      if (isMobile) {
        webviewArea.classList.add('mobile-frame');
      }

      // ========== CREATE WEBVIEW ==========
      // CRITICAL: Create webview, set partition, then add to DOM.
      // The webview MUST be in the DOM before loading a URL.
      // Stealth injection is handled by the main process via web-contents-created event.

      var webview = document.createElement('webview');

      // Set partition BEFORE adding to DOM
      webview.setAttribute('partition', partitionName);

      // Set mobile dimensions
      if (isMobile) {
        webview.style.width = mobileWidth + 'px';
        webview.style.height = mobileHeight + 'px';
      }

      // Add webview to the DOM first
      webviewArea.appendChild(webview);

      // ---- Navigation functions ----
      function navigateTo(url) {
        if (!url) return;
        if (!url.match(/^https?:\/\//i) && !url.startsWith('file://')) {
          if (url.includes('.') && !url.includes(' ')) {
            url = 'https://' + url;
          } else {
            url = 'https://www.google.com/search?q=' + encodeURIComponent(url);
          }
        }
        urlInput.value = url;
        hideError();
        webview.loadURL(url);
      }

      urlInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          navigateTo(urlInput.value.trim());
          urlInput.blur();
        }
      });

      urlInput.addEventListener('focus', function() { this.select(); });

      btnBack.addEventListener('click', function() { if (webview.canGoBack()) webview.goBack(); });
      btnForward.addEventListener('click', function() { if (webview.canGoForward()) webview.goForward(); });
      btnRefresh.addEventListener('click', function() { webview.reload(); });
      btnHome.addEventListener('click', function() { navigateTo('https://iphey.com'); });
      btnRetry.addEventListener('click', function() { navigateTo(urlInput.value); });
      btnNewTab.addEventListener('click', function() { navigateTo('https://www.google.com'); });

      // ---- Webview event handlers ----
      webview.addEventListener('did-start-loading', function() {
        loadingBar.classList.add('active');
      });

      webview.addEventListener('did-stop-loading', function() {
        loadingBar.classList.remove('active');
        updateNavButtons();
      });

      webview.addEventListener('did-navigate', function(e) {
        urlInput.value = e.url;
        updateNavButtons();
      });

      webview.addEventListener('did-navigate-in-page', function(e) {
        if (e.url) urlInput.value = e.url;
        updateNavButtons();
      });

      webview.addEventListener('did-redirect-navigation', function(e) {
        urlInput.value = e.url;
      });

      webview.addEventListener('page-title-updated', function(e) {
        tabTitle.textContent = e.title;
        document.title = e.title + ' - Joe Browser';
      });

      webview.addEventListener('page-favicon-updated', function(e) {
        if (e.favicons && e.favicons.length > 0) {
          tabFavicon.style.background = '';
          tabFavicon.innerHTML = '';
          var img = document.createElement('img');
          img.src = e.favicons[0];
          img.style.width = '14px';
          img.style.height = '14px';
          img.style.borderRadius = '2px';
          tabFavicon.appendChild(img);
        }
      });

      webview.addEventListener('did-fail-load', function(e) {
        if (e.errorCode !== -3 && e.errorCode !== 0) {
          loadingBar.classList.remove('active');
          showError('Failed to load: ' + e.errorDescription + ' (Error ' + e.errorCode + ')');
        }
      });

      // CRITICAL: Handle new-window - navigate in SAME webview, NOT popup
      webview.addEventListener('new-window', function(e) {
        e.preventDefault();
        navigateTo(e.url);
      });

      // ---- Update navigation buttons ----
      function updateNavButtons() {
        btnBack.disabled = !webview.canGoBack();
        btnForward.disabled = !webview.canGoForward();
        updateUrlIcon();
      }

      function updateUrlIcon() {
        var url = urlInput.value;
        if (url.startsWith('https://')) {
          urlIcon.textContent = '\uD83D\uDD12';
          urlIcon.className = 'url-bar-icon secure';
        } else if (url.startsWith('http://')) {
          urlIcon.textContent = '\u26A0';
          urlIcon.className = 'url-bar-icon insecure';
        } else {
          urlIcon.textContent = '\u2139';
          urlIcon.className = 'url-bar-icon';
          urlIcon.style.color = '#9aa0a6';
        }
      }

      function showError(msg) {
        errorMessage.textContent = msg;
        errorPage.classList.add('active');
        webviewArea.style.display = 'none';
      }

      function hideError() {
        errorPage.classList.remove('active');
        webviewArea.style.display = '';
      }

      // ========== LOAD THE INITIAL URL ==========
      // CRITICAL FIX: Wait for the webview to be attached to the DOM
      // before loading a URL. The 'did-attach' event fires when the
      // webview's internal process is ready.

      urlInput.value = targetUrl;

      webview.addEventListener('did-attach', function() {
        console.log('[JoeBrowser] Webview attached, loading: ' + targetUrl);
        try {
          webview.loadURL(targetUrl);
        } catch (err) {
          console.error('[JoeBrowser] loadURL failed:', err);
          // Fallback: try src attribute
          webview.src = targetUrl;
        }
      });

      // Fallback: if did-attach doesn't fire (some Electron versions),
      // try loading after a short delay
      setTimeout(function() {
        try {
          var currentUrl = webview.getURL();
          if (!currentUrl || currentUrl === '' || currentUrl === 'about:blank') {
            console.log('[JoeBrowser] Fallback: loading URL after timeout');
            webview.loadURL(targetUrl);
          }
        } catch (err) {
          console.log('[JoeBrowser] Fallback loadURL error:', err);
          webview.src = targetUrl;
        }
      }, 1000);

    })();
  </script>
</body>
</html>
