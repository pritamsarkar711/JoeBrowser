appId: com.joebrowser.app
productName: JoeBrowser
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - "!out/renderer/**/*"
  - src/main/assets/**/*
extraResources:
  - from: src/main/assets/browser-chrome.html
    to: browser-chrome.html
win:
  target: nsis
  icon: build/icon.ico
mac:
  target: dmg
  icon: build/icon.icns
linux:
  target: AppImage
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
