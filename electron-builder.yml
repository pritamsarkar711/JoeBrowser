# electron-builder configuration — produces the Windows installers uploaded to
# the GitHub Releases page (https://github.com/pritamsarkar711/JoeBrowser/releases).
appId: com.joebrowser.app
productName: JoeBrowser
copyright: Copyright © 2026 JoeBrowser
npmRebuild: true

directories:
  buildResources: build
  output: release

# The compiled electron-vite output plus production dependencies only.
files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!**/*.ts'
  - '!**/*.tsbuildinfo'

asar: true

# Native .node binaries must live outside the asar archive or they cannot
# be dlopen()ed on Windows.
asarUnpack:
  - node_modules/better-sqlite3/**

# Bundled assets the main process loads at runtime from process.resourcesPath:
#  - resources/extension  -> stealth extension templates (Chrome + Firefox)
#  - resources/icon.png   -> window/tray icon
extraResources:
  - from: src/extension
    to: extension
  - from: build/icon.png
    to: icon.png
  - from: src/main/assets/browser-chrome.html
    to: browser-chrome.html

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: JoeBrowser
  uninstallDisplayName: JoeBrowser
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-Setup-${version}.${ext}

portable:
  artifactName: ${productName}-Portable-${version}.${ext}

mac:
  icon: build/icon.png
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]

dmg:
  artifactName: ${productName}-${version}-${arch}.dmg

linux:
  icon: build/icon.png
  category: Network
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]

appImage:
  artifactName: ${productName}-${version}-x64.AppImage

deb:
  artifactName: ${productName}-${version}-amd64.deb

rpm:
  artifactName: ${productName}-${version}-x86_64.rpm

publish:
  provider: github
  owner: pritamsarkar711
  repo: JoeBrowser
