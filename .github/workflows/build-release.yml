# Builds the Windows EXE installers (NSIS setup + portable) and publishes them
# to the GitHub Releases page:
#   https://github.com/pritamsarkar711/JoeBrowser/releases
#
# Triggered by:
#   - pushing a version tag (v1.0.0, v1.0.1, ...)  -> EXEs uploaded to the release
#   - manual "Run workflow" from the Actions tab   -> EXEs as run artifacts
name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Self-test suite (plain node)
        run: npm run selftest

      - name: Build (electron-vite)
        run: npm run build

      - name: Package Windows EXEs (NSIS + portable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx electron-builder --win --publish never

      - name: List artifacts
        shell: powershell
        run: Get-ChildItem release | Select-Object Name, Length

      - name: Upload EXEs to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/JoeBrowser-Setup-*.exe
            release/JoeBrowser-Portable-*.exe
            release/JoeBrowser-Setup-*.exe.blockmap
            release/latest.yml
          generate_release_notes: true
          fail_on_unmatched_files: false

      - name: Upload build artifacts (workflow run page)
        uses: actions/upload-artifact@v4
        with:
          name: joebrowser-windows-exe
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30
